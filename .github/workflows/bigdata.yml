name: Big Data Ingestion and Enrichment Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  run-enrichment-pipeline:
    name: Ejecución del Pipeline de Enriquecimiento
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código fuente del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Ejecutar proceso de ingesta, enriquecimiento y exportación
        run: |
          python src/enrichement.py

      - name: 5. Imprimir reporte de auditoría en Logs (Evidencia)
        run: |
          echo "=========================================================="
          echo "         REPORTE DE AUDITORÍA GENERADO EN RUNNER          "
          echo "=========================================================="
          cat static/auditoria/enriched_report.txt

      - name: 6. Almacenar Artefactos de Salida (Data Enriquecida & Reportes)
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-enriquecimiento-datos
          path: |
            xlsx/enriched_data.xlsx
            static/auditoria/enriched_report.txt
            db/ingestion.db
          retention-days: 30

      - name: 7. Commit & Push de Archivos Generados al Repositorio (Opcional)
        if: github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add db/ static/ xlsx/ sources/
          git status
          git commit -m "auto(pipeline): actualización de base de datos, reporte y dataset enriquecido [skip ci]" || echo "No hay cambios para confirmar."
          git push